[package]
name = "discord-tauri"
version = "1.0.0"
description = "A Tauri desktop browser that opens Discord login in-app and routes other links to the external browser."
authors = ["Neko7sora"]
license = "MIT"
edition = "2021"
rust-version = "1.94"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tauri = { version = "2", features = ["image-ico", "image-png"] }
url = "2"

[profile.release]
codegen-units = 8
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
